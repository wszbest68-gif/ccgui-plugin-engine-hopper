# 发版流水线（Obsidian 同款约定：tag = manifest version，无 v 前缀）。
# 推送 tag 触发：校验 manifest → 校验 tag 与版本一致 → 生成校验和 → 发 Release。
# 本插件为手写单文件 ESM，无构建步骤；Release 产物即源码三件套 + checksums.txt。
name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG != manifest version $VERSION"
            exit 1
          fi

      - name: Generate checksums
        run: |
          FILES="main.js manifest.json"
          [ -f styles.css ] && FILES="$FILES styles.css"
          sha256sum $FILES > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            checksums.txt
